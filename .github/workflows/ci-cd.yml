
name: CI/CD Pipeline - Build and Push

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Normalize Docker Hub username
        id: dockerhub
        run: |
          username="$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr -d '[:space:]')"
          if [ -z "$username" ]; then
            echo "DOCKERHUB_USERNAME secret is missing or empty."
            exit 1
          fi
          echo "username=$username" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.dockerhub.outputs.username }}/sample-web-app:v1.0.${{ github.run_number }}
